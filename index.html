<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carbz</title>
<!-- Nom, icône et couleurs quand l'app est ajoutée à l'écran d'accueil -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icone-180.png">
<meta name="apple-mobile-web-app-title" content="Carbz">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#12733a">
<!--
  Carbz : carte des carburants les moins chers autour de vous.

  Page autonome : à chaque ouverture, le navigateur demande la position,
  puis télécharge directement les prix officiels (flux « Prix des carburants
  en France », mis à jour toutes les 10 minutes). Aucun serveur nécessaire.
-->
<link rel="stylesheet" href="leaflet.css">
<style>
  :root { --fond:#ffffff; --texte:#1b1f24; --doux:#5c6570; --trait:#e3e6ea;
          --vert:#12733a; --orange:#a85b00; --rouge:#b3261e; --gris:#7a828c;
          --accent:#0b57d0; }
  @media (prefers-color-scheme: dark) {
    :root { --fond:#16191d; --texte:#eceff2; --doux:#a3abb5; --trait:#2c3138;
            --accent:#8ab4f8; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
         color: var(--texte); background: var(--fond); display: flex; }
  #panneau { width: 340px; flex: none; overflow-y: auto; padding: 16px;
             border-right: 1px solid var(--trait); }
  #carte { flex: 1; min-height: 0; }
  .entete { display: flex; align-items: flex-start; gap: 10px; }
  .entete div { flex: 1; }
  h1 { font-size: 18px; margin: 0 0 2px; }
  .sous { color: var(--doux); font-size: 13px; margin: 0 0 14px; }
  #localiser { font: inherit; font-size: 13px; padding: 6px 10px; border-radius: 8px;
               border: 1px solid var(--trait); background: none; color: var(--accent);
               cursor: pointer; white-space: nowrap; }
  #localiser:disabled { opacity: .5; cursor: wait; }
  #rayons { display: flex; align-items: center; gap: 6px; margin: -4px 0 12px;
            font-size: 13px; color: var(--doux); }
  #rayons button { font: inherit; padding: 3px 9px; border-radius: 999px;
                   border: 1px solid var(--trait); background: none;
                   color: var(--texte); cursor: pointer; }
  #rayons button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent);
                   font-weight: 600; }
  #choix { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  #choix button { font: inherit; padding: 6px 11px; border-radius: 999px;
                  border: 1px solid var(--trait); background: none;
                  color: var(--texte); cursor: pointer; }
  #choix button[aria-pressed="true"] { background: var(--accent);
                  border-color: var(--accent); color: var(--fond); font-weight: 600; }
  h2 { font-size: 14px; margin: 0 0 4px; }
  #favoris { margin-bottom: 14px; }
  .alerte { background: color-mix(in srgb, var(--orange) 14%, transparent);
            border-radius: 8px; padding: 8px 10px; font-size: 13px; margin-bottom: 12px; }
  .alerte button { font: inherit; margin-left: 6px; padding: 2px 8px; border-radius: 6px;
                   border: 1px solid currentColor; background: none; color: inherit;
                   cursor: pointer; }
  .etoile { color: #d18f00; }
  .fav { font: inherit; font-size: 13px; margin-top: 8px; padding: 4px 10px;
         border-radius: 8px; border: 1px solid #c9ced4; background: #fff;
         color: #1b1f24; cursor: pointer; }
  #bilan { 1px solid var(--trait); border-radius: 10px; padding: 12px;
           margin-bottom: 14px; }
  #bilan b { font-size: 22px; font-variant-numeric: tabular-nums; }
  #bilan p { margin: 4px 0 0; color: var(--doux); font-size: 13px; }
  #bilan button { font: inherit; margin-top: 8px; padding: 6px 12px; border-radius: 8px;
                  border: 0; background: var(--accent); color: var(--fond); cursor: pointer; }
  ol { list-style: none; margin: 0; padding: 0; }
  li button { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px;
              width: 100%; text-align: left; font: inherit; color: inherit;
              background: none; border: 0; border-top: 1px solid var(--trait);
              padding: 10px 2px; cursor: pointer; }
  li button:hover { background: color-mix(in srgb, var(--accent) 8%, transparent); }
  li .p { grid-row: span 2; font-size: 17px; font-weight: 700;
          font-variant-numeric: tabular-nums; align-self: center; }
  li .d { color: var(--doux); font-size: 13px; }
  .vert { color: var(--vert); } .orange { color: var(--orange); }
  .rouge { color: var(--rouge); } .gris { color: var(--gris); }
  .etiquette { background: #fff; border: 2px solid currentColor; border-radius: 8px;
               padding: 1px 6px; font: 700 12px system-ui, sans-serif;
               font-variant-numeric: tabular-nums; white-space: nowrap;
               box-shadow: 0 1px 4px rgba(0,0,0,.3); transform: translate(-50%, -50%);
               display: inline-block; }
  .etiquette.gris { font-weight: 500; opacity: .75; }
  .leaflet-popup-content { font: 14px/1.45 system-ui, sans-serif; margin: 12px 14px; }
  .leaflet-popup-content table { border-collapse: collapse; margin: 6px 0; }
  .leaflet-popup-content td { padding: 1px 10px 1px 0; }
  .leaflet-popup-content td.n { font-weight: 700; font-variant-numeric: tabular-nums; }
  .leaflet-popup-content small { color: #5c6570; }
  footer { color: var(--doux); font-size: 12px; margin-top: 16px; }
  @media (max-width: 700px) {
    body { flex-direction: column-reverse; }
    #panneau { width: auto; max-height: 46vh; border-right: 0;
               border-top: 1px solid var(--trait); }
  }
</style>
</head>
<body>
<aside id="panneau">
  <div class="entete">
    <div>
      <h1>Carbz</h1>
      <p class="sous" id="sous">Recherche de votre position…</p>
    </div>
    <button id="localiser" type="button">Me localiser</button>
  </div>
  <div id="rayons" role="group" aria-label="Rayon de recherche">Rayon</div>
  <div id="choix" role="group" aria-label="Carburant"></div>
  <p class="alerte" id="alerte" hidden></p>
  <section id="favoris" hidden>
    <h2><span class="etoile">★</span> Mes stations</h2>
    <ol id="listeFavoris"></ol>
  </section>
  <div id="bilan"><p>Chargement…</p></div>
  <h2 id="titreTop" hidden>Les 10 moins chères</h2>
  <ol id="liste"></ol>
  <footer id="pied"></footer>
</aside>
<div id="carte"></div>

<script src="leaflet.js"></script>
<script>
// --------------------------------------------------------------------------
// RÉGLAGES
// --------------------------------------------------------------------------
const DEFAUT = {nom: "Salon-de-Provence", lat: 43.6405, lon: 5.0970};
const RAYONS_KM = [5, 10, 15, 25];  // choix proposés ; 15 km par défaut
const LITRES_PLEIN = 50;     // sert à chiffrer l'économie sur un plein
const AGE_MAX_JOURS = 3;     // au-delà, un prix est considéré comme périmé

const API = "https://data.economie.gouv.fr/api/explore/v2.1/catalog/datasets/" +
            "prix-des-carburants-en-france-flux-instantane-v2/records";
const NOMS = {gazole: "Gazole", e10: "SP95-E10", sp98: "SP98",
              sp95: "SP95", e85: "E85", gplc: "GPLc"};

// --------------------------------------------------------------------------
// MÉMOIRE DU TÉLÉPHONE : réglages gardés d'une ouverture à l'autre
// (try/catch : certains navigateurs, en navigation privée, refusent l'accès.)
// --------------------------------------------------------------------------
function lireReglage(cle, defaut) {
  try {
    const valeur = localStorage.getItem("carbz." + cle);
    return valeur === null ? defaut : JSON.parse(valeur);
  } catch (e) { return defaut; }
}
function ecrireReglage(cle, valeur) {
  try { localStorage.setItem("carbz." + cle, JSON.stringify(valeur)); } catch (e) {}
}

let rayon = lireReglage("rayon", 15);
if (!RAYONS_KM.includes(rayon)) rayon = 15;
let carburantChoisi = lireReglage("carburant", null);
let favoris = lireReglage("favoris", []);   // [{id, adresse, ville}]

let stations = [];           // stations du rayon, une fois nettoyées
let horsZone = [];           // favoris situés hors du rayon
let classees = [];           // stations du rayon classées pour le carburant choisi
let marqueurs = new Map();   // identifiant de station -> étiquette sur la carte
let centre = null;           // position utilisée pour la recherche
let chargement = 0;          // numéro du dernier chargement lancé

// --------------------------------------------------------------------------
// PETITS OUTILS
// --------------------------------------------------------------------------
const $ = id => document.getElementById(id);
const euro = n => n.toFixed(3).replace(".", ",") + " €";
const km = n => n.toFixed(1).replace(".", ",") + " km";
const echappe = t => String(t).replace(/[&<>"']/g,
  c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
// « 17 ROUTE NATIONALE » -> « 17 Route Nationale »
const majuscules = t => String(t || "").trim().toLowerCase()
  .replace(/(^|[^\p{L}])(\p{L})/gu, (m, avant, lettre) => avant + lettre.toUpperCase());
const dateCourte = d => d.toLocaleString("fr-FR", {dateStyle: "short", timeStyle: "short"})
  .replace(" ", " à ");

// L'âge d'un prix est recalculé à chaque affichage (utile pour les prix gardés hors ligne)
const age = p => ageEnJours(p.maj);
const frais = p => age(p) === null || age(p) <= AGE_MAX_JOURS;
const quand = p => age(p) === null ? "date inconnue"
  : age(p) < 1 ? "mis à jour aujourd'hui"
  : "mis à jour il y a " + Math.round(age(p)) + " j";
const estFavori = id => favoris.some(f => f.id === id);

// Distance à vol d'oiseau (formule de haversine), en km
function distanceKm(a, b) {
  const rad = x => x * Math.PI / 180;
  const h = Math.sin(rad(b.lat - a.lat) / 2) ** 2 +
    Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(rad(b.lon - a.lon) / 2) ** 2;
  return 6371 * 2 * Math.asin(Math.sqrt(h));
}

// Nombre de jours écoulés depuis la dernière mise à jour du prix
function ageEnJours(texte) {
  const date = Date.parse(String(texte).replace(" ", "T"));
  if (isNaN(date)) return null;
  return Math.round((Date.now() - date) / 86400000 * 10) / 10;
}

// --------------------------------------------------------------------------
// POSITION : on demande au téléphone, sinon Salon-de-Provence
// --------------------------------------------------------------------------
function obtenirPosition() {
  return new Promise(resolve => {
    if (!navigator.geolocation) return resolve(DEFAUT);
    navigator.geolocation.getCurrentPosition(
      p => resolve({nom: "votre position", lat: p.coords.latitude, lon: p.coords.longitude}),
      () => resolve(DEFAUT),   // refus, délai dépassé ou erreur
      {timeout: 10000, maximumAge: 5 * 60000});
  });
}

// --------------------------------------------------------------------------
// DONNÉES
// --------------------------------------------------------------------------
// Interroge l'API avec un filtre. Elle renvoie 100 stations maximum par appel :
// on avance donc par paquets.
async function interroger(filtre) {
  const brutes = [];
  for (let offset = 0; ; offset += 100) {
    const url = API + "?" + new URLSearchParams({where: filtre, limit: 100, offset});
    const reponse = await fetch(url);
    if (!reponse.ok) throw new Error("L'API a répondu " + reponse.status);
    const donnees = await reponse.json();
    const paquet = donnees.results || [];
    brutes.push(...paquet);
    if (paquet.length < 100 || offset + 100 >= (donnees.total_count || 0)) return brutes;
  }
}

// Les stations du rayon
const telechargerZone = c =>
  interroger(`within_distance(geom, geom'POINT(${c.lon} ${c.lat})', ${rayon}km)`);

// Des stations précises, par identifiant (pour les favoris hors du rayon)
function telechargerStations(ids) {
  ids = ids.map(Number).filter(Number.isFinite);
  return ids.length ? interroger(`id in (${ids.join(",")})`) : Promise.resolve([]);
}

function coordonnees(brut) {
  const g = brut.geom || {};
  if (g.lat != null && g.lon != null) return {lat: +g.lat, lon: +g.lon};
  // Ancien format : entiers en cent-millièmes de degré
  const lat = brut.latitude / 100000, lon = brut.longitude / 100000;
  return isFinite(lat) && isFinite(lon) ? {lat, lon} : null;
}

// Transforme une station brute en objet simple pour la carte.
// dansRayon = false : on garde la station même si elle est loin (favoris).
function nettoyer(brut, depuis, dansRayon = true) {
  const pos = coordonnees(brut);
  if (!pos) return null;
  const distance = distanceKm(depuis, pos);
  if (dansRayon && distance > rayon) return null;

  const prix = {};
  for (const c of Object.keys(NOMS)) {
    const valeur = parseFloat(brut[c + "_prix"]);
    if (!(valeur > 0.3 && valeur < 5)) continue;  // absent ou aberrant
    prix[c] = {prix: Math.round(valeur * 1000) / 1000, maj: brut[c + "_maj"] || null};
  }
  if (!Object.keys(prix).length) return null;

  return {
    id: Number(brut.id),
    adresse: majuscules(brut.adresse), ville: majuscules(brut.ville), cp: brut.cp || "",
    lat: pos.lat, lon: pos.lon, km: distance,
    auto24: String(brut.horaires_automate_24_24 || "").toLowerCase() === "oui",
    prix,
  };
}

// Derniers prix chargés, gardés pour pouvoir les réafficher sans réseau
const sauverCache = () =>
  ecrireReglage("cache", {date: Date.now(), centre, rayon, stations, horsZone});

// --------------------------------------------------------------------------
// CARTE
// --------------------------------------------------------------------------
const carte = L.map("carte").setView([DEFAUT.lat, DEFAUT.lon], 11);
// Fond de carte : Plan IGN, service public en accès libre, sans clé.
L.tileLayer("https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0" +
  "&LAYER=GEOGRAPHICALGRIDSYSTEMS.PLANIGNV2&STYLE=normal&FORMAT=image/png" +
  "&TILEMATRIXSET=PM&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}", {
  maxNativeZoom: 18, maxZoom: 19,
  attribution: "&copy; IGN-Géoplateforme"}).addTo(carte);
const calque = L.layerGroup().addTo(carte);
let zone = null, pointCentre = null;

function placerCentre(c) {
  if (zone) zone.remove();
  if (pointCentre) pointCentre.remove();
  zone = L.circle([c.lat, c.lon], {radius: rayon * 1000, color: "#0b57d0",
    weight: 1, fill: false, dashArray: "4 6", interactive: false}).addTo(carte);
  pointCentre = L.circleMarker([c.lat, c.lon], {radius: 6, color: "#fff",
    weight: 2, fillColor: "#0b57d0", fillOpacity: 1}).bindPopup(c.nom).addTo(carte);
  carte.invalidateSize();             // remesure la carte (taille parfois 0 au démarrage)
  carte.fitBounds(zone.getBounds());  // cadre la carte sur le rayon
}

const texteFavori = id => estFavori(id) ? "★ Retirer des favoris" : "☆ Ajouter aux favoris";

function infobulle(s) {
  const lignes = Object.keys(NOMS).filter(c => s.prix[c]).map(c =>
    `<tr><td>${c === carburantChoisi ? "<b>" + NOMS[c] + "</b>" : NOMS[c]}</td>` +
    `<td class="n">${euro(s.prix[c].prix)}</td>` +
    `<td><small>${quand(s.prix[c])}</small></td></tr>`).join("");
  return `<b>${echappe(s.adresse)}</b><br>${echappe(s.cp)} ${echappe(s.ville)}` +
    `<table>${lignes}</table>` +
    `<small>${km(s.km)}${s.auto24 ? " · automate 24h/24" : ""}</small><br>` +
    `<a target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1` +
    `&destination=${s.lat},${s.lon}">Itinéraire</a><br>` +
    `<button type="button" class="fav" data-id="${s.id}">${texteFavori(s.id)}</button>`;
}

// Centre la carte sur une station et ouvre sa bulle
function voir(s) {
  const m = marqueurs.get(s.id);
  if (m) {
    carte.setView([s.lat, s.lon], 15);
    m.openPopup();
  } else {  // favori hors du rayon : pas d'étiquette, juste une bulle
    carte.setView([s.lat, s.lon], 14);
    L.popup().setLatLng([s.lat, s.lon]).setContent(infobulle(s)).openOn(carte);
  }
}

// --------------------------------------------------------------------------
// AFFICHAGE
// --------------------------------------------------------------------------
// Dessine les étiquettes de prix du carburant choisi, puis les listes
function afficher(c) {
  carburantChoisi = c;
  ecrireReglage("carburant", c);
  calque.clearLayers();
  marqueurs = new Map();
  document.querySelectorAll("#choix button").forEach(b =>
    b.setAttribute("aria-pressed", b.dataset.c === c));

  const toutes = stations.filter(s => s.prix[c]);
  classees = toutes.filter(s => frais(s.prix[c]))
                   .sort((a, b) => a.prix[c].prix - b.prix[c].prix);
  const rang = new Map(classees.map((s, i) => [s, i]));

  toutes.forEach(s => {
    const i = rang.get(s);
    const couleur = i === undefined ? "gris"
      : i < classees.length / 3 ? "vert"
      : i < classees.length * 2 / 3 ? "orange" : "rouge";
    const m = L.marker([s.lat, s.lon], {
      icon: L.divIcon({className: "", iconSize: [0, 0],
        html: `<span class="etiquette ${couleur}">${euro(s.prix[c].prix)}</span>`}),
      zIndexOffset: i === undefined ? -1000 : 1000 - i,
    }).bindPopup(() => infobulle(s)).addTo(calque);  // bulle recalculée à l'ouverture
    marqueurs.set(s.id, m);
  });

  afficherListes();
}

function ligne(s, prix, classe, details) {
  const li = document.createElement("li");
  const b = document.createElement("button");
  b.type = "button";
  b.innerHTML = `<span class="p ${classe}">${prix}</span>` +
    `<span>${estFavori(s.id) ? '<span class="etoile">★</span> ' : ""}${echappe(s.adresse)}</span>` +
    `<span class="d">${details}</span>`;
  return [li, b];
}

// « Mes stations », le résumé et le top 10
function afficherListes() {
  const c = carburantChoisi;

  const listeFavoris = $("listeFavoris");
  listeFavoris.innerHTML = "";
  $("favoris").hidden = !favoris.length;
  const parId = new Map([...stations, ...horsZone].map(s => [s.id, s]));
  favoris.forEach(f => {
    const s = parId.get(f.id);
    const p = s && s.prix[c];
    const details = [echappe(f.ville)];
    if (s) details.push(km(s.km));
    if (!s) details.push("prix indisponible");
    else if (!p) details.push("pas de " + NOMS[c]);
    else if (!frais(p)) details.push("prix ancien");
    const [li, b] = ligne(s || f, p ? euro(p.prix) : "—", p && frais(p) ? "" : "gris",
                          details.join(" · "));
    if (s) b.onclick = () => voir(s); else b.disabled = true;
    li.appendChild(b);
    listeFavoris.appendChild(li);
  });

  const liste = $("liste");
  liste.innerHTML = "";
  $("titreTop").hidden = !classees.length;
  if (!classees.length) {
    $("bilan").innerHTML = `<p>Aucun prix récent pour ${NOMS[c]} dans ce rayon.</p>`;
    return;
  }
  const mini = classees[0].prix[c].prix;
  const maxi = classees[classees.length - 1].prix[c].prix;
  const gain = ((maxi - mini) * LITRES_PLEIN).toFixed(2).replace(".", ",");
  $("bilan").innerHTML = `<b class="vert">${euro(mini)}</b> le litre au moins cher` +
    `<p>${gain} € d'écart sur un plein de ${LITRES_PLEIN} L entre la station la moins ` +
    `chère et la plus chère (${classees.length} stations comparées).</p>`;

  classees.slice(0, 10).forEach(s => {
    const [li, b] = ligne(s, euro(s.prix[c].prix), "vert",
                          `${echappe(s.ville)} · ${km(s.km)}`);
    b.onclick = () => voir(s);
    li.appendChild(b);
    liste.appendChild(li);
  });
}

// Ajoute ou retire une station des favoris
function basculerFavori(id) {
  if (estFavori(id)) {
    favoris = favoris.filter(f => f.id !== id);
  } else {
    const s = [...stations, ...horsZone].find(x => x.id === id);
    if (s) favoris.push({id, adresse: s.adresse, ville: s.ville});
  }
  ecrireReglage("favoris", favoris);
  afficherListes();
}

// Bouton « favori » dans les bulles (elles sont créées à la volée)
document.addEventListener("click", e => {
  const b = e.target.closest(".fav");
  if (!b) return;
  const id = Number(b.dataset.id);
  basculerFavori(id);
  b.textContent = texteFavori(id);
});

// Remplit la page avec les stations en mémoire (fraîches ou gardées hors ligne)
function afficherDonnees(date) {
  $("sous").textContent = `${rayon} km autour de ${centre.nom} · ${stations.length} stations`;
  $("pied").textContent = `Données officielles (prix-carburants.gouv.fr) chargées le ` +
    `${dateCourte(date)}. En gris sur la carte : prix de plus de ` +
    `${AGE_MAX_JOURS} jours, exclus du classement.`;

  $("choix").innerHTML = "";
  const disponibles = Object.keys(NOMS).filter(c => stations.some(s => s.prix[c]));
  disponibles.forEach(c => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = NOMS[c];
    b.dataset.c = c;
    b.onclick = () => afficher(c);
    $("choix").appendChild(b);
  });
  if (disponibles.length) {
    afficher(disponibles.includes(carburantChoisi) ? carburantChoisi : disponibles[0]);
  } else {
    $("bilan").innerHTML = "<p>Aucune station trouvée dans ce rayon.</p>";
    afficherListes();
  }
}

// --------------------------------------------------------------------------
// DÉMARRAGE : position -> téléchargement -> affichage
// --------------------------------------------------------------------------
// Cherche la position, puis charge les prix autour.
async function localiser() {
  $("localiser").disabled = true;
  $("sous").textContent = "Recherche de votre position…";
  centre = await obtenirPosition();
  $("localiser").disabled = false;
  charger();
}

// Charge les prix autour de « centre », dans le rayon choisi.
async function charger() {
  // Si un autre chargement démarre entre-temps (changement de rayon rapide),
  // celui-ci s'arrête : seul le plus récent s'affiche.
  const numero = ++chargement;
  $("alerte").hidden = true;
  $("bilan").innerHTML = "<p>Chargement…</p>";
  $("liste").innerHTML = "";
  $("titreTop").hidden = true;
  $("choix").innerHTML = "";
  calque.clearLayers();
  placerCentre(centre);
  $("sous").textContent = `${rayon} km autour de ${centre.nom} · chargement des prix…`;

  let zoneBrute, favorisBruts;
  try {
    zoneBrute = await telechargerZone(centre);
    const ids = new Set(zoneBrute.map(b => Number(b.id)));
    favorisBruts = await telechargerStations(favoris.map(f => f.id).filter(id => !ids.has(id)));
  } catch (erreur) {
    if (numero === chargement) horsLigne();
    return;
  }
  if (numero !== chargement) return;
  stations = zoneBrute.map(b => nettoyer(b, centre)).filter(Boolean);
  const dansZone = new Set(stations.map(s => s.id));
  horsZone = [...zoneBrute, ...favorisBruts]
    .filter(b => favoris.some(f => f.id === Number(b.id)) && !dansZone.has(Number(b.id)))
    .map(b => nettoyer(b, centre, false)).filter(Boolean);
  sauverCache();
  afficherDonnees(new Date());
}

// Pas de réseau : on réaffiche les derniers prix gardés, s'il y en a
function horsLigne() {
  const cache = lireReglage("cache", null);
  if (!cache) {
    $("sous").textContent = `${rayon} km autour de ${centre.nom}`;
    $("bilan").innerHTML = "<p>Impossible de charger les prix. Vérifiez la connexion " +
      "Internet, puis réessayez.</p><button type='button'>Réessayer</button>";
    $("bilan").querySelector("button").onclick = charger;
    return;
  }
  ({centre, rayon, stations, horsZone} = cache);
  majBoutonsRayon();
  placerCentre(centre);
  afficherDonnees(new Date(cache.date));
  $("alerte").innerHTML = `Pas de connexion : prix enregistrés le ${dateCourte(new Date(cache.date))}.` +
    "<button type='button'>Réessayer</button>";
  $("alerte").querySelector("button").onclick = localiser;
  $("alerte").hidden = false;
}

// Boutons de rayon : on recharge autour de la même position
const majBoutonsRayon = () => document.querySelectorAll("#rayons button").forEach(b =>
  b.setAttribute("aria-pressed", Number(b.dataset.r) === rayon));
RAYONS_KM.forEach(r => {
  const b = document.createElement("button");
  b.type = "button";
  b.textContent = r + " km";
  b.dataset.r = r;
  b.onclick = () => {
    rayon = r;
    ecrireReglage("rayon", r);
    majBoutonsRayon();
    if (centre) charger();
  };
  $("rayons").appendChild(b);
});
majBoutonsRayon();

$("localiser").onclick = localiser;
localiser();

// Sur le site web, garde une copie de l'app pour qu'elle s'ouvre sans réseau.
// (Inutile dans l'app des stores, qui contient déjà tous ses fichiers.)
if ("serviceWorker" in navigator && location.protocol === "https:" && !window.Capacitor) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
